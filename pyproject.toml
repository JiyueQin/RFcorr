[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rfcorr"
version = "0.1.0"
description = "Correlation between two random fields (maps), with standard errors that account for spatial dependence"
requires-python = ">=3.11"  # tomllib
# lower bounds: the oldest versions the tests were run with (numpy 2 support for all four);
# exact versions for reproducible server runs are pinned in requirements.txt
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "gstools>=1.6",
]

[project.optional-dependencies]
# server simulation scripts (job_inputs/, array_job/) and saving summaries to Excel
jobs = ["joblib", "openpyxl"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["rfcorr*"]

[tool.setuptools.package-data]
"rfcorr.defaults" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
