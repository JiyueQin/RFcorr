# Package-wide settings for rfcorr. Read with rc.get_defaults().

# Standard error methods, named after the methods in the paper. Each gives two standard errors,
# `se` (at the plugin rho) and `se_under_null` (at rho = 0):
#   'general' -> RFCorr                                and RFCorr-0
#   'gauss'   -> RFCorr-Gauss                          and RFCorr-Gauss-0
#   'indep'   -> (1 - rho^2)^2 times RFCorr-Indep-0    and RFCorr-Indep-0
#   'iid'     -> (1 - rho^2)^2 / n, ignoring spatial dependence
se_methods = ["general", "gauss", "indep", "iid"]

# Dependence designs that are only meaningful with rho = 0 (see rc.gen_corr_field):
# rc.make_setting_df keeps them only in rows with rho = 0.
rho_zero_dep_models = ["shift", "symmetric_shift", "sum_diff"]

# Earlier names of the standard error methods, still accepted so saved method tables keep working.
[se_method_aliases]
hac = "general"
hac_gaussian = "gauss"
huristic = "indep"
